  <meta name="theme-color" content="#123D2B">

  <link rel="canonical" href="https://royalsociety.go.th/pages/series.html">
  <link rel="alternate" hreflang="th" href="https://royalsociety.go.th/pages/series.html">

  <meta property="og:type" content="website">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">

  <link rel="preload" href="../assets/fonts/THSarabunNew-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preload" href="../assets/fonts/THSarabunNew-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../assets/css/tokens.css?v=20261127g">
  <link rel="stylesheet" href="../assets/css/base.css?v=20261127g">
  <link rel="stylesheet" href="../assets/css/layout.css?v=20261127g">
  <link rel="stylesheet" href="../assets/css/components.css?v=20261127g">
  <link rel="stylesheet" href="../assets/css/pages.css?v=20261127g">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20261127g">

  <script defer src="../assets/js/00-core.js?v=20261127g"></script>
  <script defer src="../assets/js/01-config.js?v=20261127g"></script>
  <script defer src="../assets/js/data/search-index.js?v=20261127g"></script>
  <script defer src="../assets/js/data/publications.js?v=20261127g"></script>
  <script defer src="../assets/js/data/series.js?v=20261127g"></script>
  <script defer src="../assets/js/02-components.js?v=20261127g"></script>
  <script defer src="../assets/js/03-accessibility.js?v=20261127g"></script>
  <script defer src="../assets/js/04-interactions.js?v=20261127g"></script>
  <script defer src="../assets/js/05-language.js?v=20261127g"></script>
  <script defer src="../assets/js/06-search.js?v=20261127g"></script>
  <script defer src="../assets/js/07-pub-cover.js?v=20261127g"></script>
  <script defer src="../assets/js/16-series.js?v=20261127g"></script>
  <script defer src="../assets/js/10-consent.js?v=20261127g"></script>
</head>
<body>
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <!-- One template for every series: 16-series.js fills it from
       assets/js/data/series.js by ?id= (an unknown id shows the Thai journal) -->
  <main id="main-content" tabindex="-1" class="series" data-series>
    <header class="story__head newsx-head series-head">
      <div class="container">
        <div class="story__crumbbar">
          <nav class="breadcrumb story__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
            <ol>
              <li><a href="../index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-institution"></use></svg><span data-en="Home">หน้าแรก</span></a></li>
              <li><span data-en="Publications">วารสารและสิ่งพิมพ์</span></li>
              <li><span aria-current="page" data-series-crumb></span></li>
            </ol>
          </nav>
        </div>

        <div class="series-open">
          <div class="series-open__text">
            <p class="story__meta"><span class="story__cat" data-series-kind></span></p>
            <h1 class="story__title" data-series-title></h1>
            <p class="story__dek series-open__desc" data-series-desc></p>
            <dl class="series-facts" data-series-facts></dl>
            <div class="pub-actions" data-series-actions></div>
          </div>
          <div class="series-open__cover" data-series-cover></div>
        </div>
      </div>
    </header>

    <!-- One bar: search the issues on the left, shelf / list on the right -->
    <div class="container newsx-toolbar">
      <div class="newsx-tools">
        <label class="newsx-search series-search">
          <span class="visually-hidden" data-en="Search this series">ค้นหาในชุดนี้</span>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
          <input type="search" placeholder="ค้นหาฉบับ เช่น ปีที่ ๔๐ หรือ ๒๕๕๘" data-en-placeholder="Search issues, e.g. 2015" autocomplete="off" data-series-search>
        </label>
        <div class="newsx-tools__end">
          <div class="newsx-view" role="group" aria-label="รูปแบบการแสดงผล" data-en-aria-label="View">
            <button class="btn btn--secondary btn--sm newsx-view__btn is-active" type="button" data-series-view="grid" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
              <span data-en="Covers">ปก</span>
            </button>
            <button class="btn btn--secondary btn--sm newsx-view__btn" type="button" data-series-view="list" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="15" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6h8M12 8.5h5M12 16h8M12 18.5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span data-en="List">รายการ</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="section series-body" aria-labelledby="series-issues-title">
      <div class="container">
        <h2 class="visually-hidden" id="series-issues-title" data-en="All issues">ทุกฉบับ</h2>
        <div class="series-bar">
          <p class="newsx-count" aria-live="polite" data-series-count></p>
          <!-- narrow to one year: the site's own dropdown, its options filled by 16-series.js -->
          <div class="rs-select series-jump" data-select data-series-jump hidden>
            <span class="visually-hidden" id="series-jump-label" data-en="Year">ปี</span>
            <input type="hidden" name="volume" value="" data-series-jump-input>
            <button class="rs-select__btn" type="button" id="series-jump-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="series-jump-label series-jump-btn">
              <svg class="icon rs-select__icon" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg>
              <span class="rs-select__label" data-select-label data-en="Every year">ทุกปี</span>
              <svg class="icon rs-select__chevron" aria-hidden="true" focusable="false"><use href="#i-chevron"></use></svg>
            </button>
            <ul class="rs-select__list" role="listbox" aria-labelledby="series-jump-label" hidden data-series-jump-list></ul>
          </div>
        </div>
        <ul class="newsx-items newsx-items--grid series-items" role="list" data-series-groups></ul>
        <p class="newsx-empty" data-series-empty hidden>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
          <span data-en="No issue matches your search.">ไม่พบฉบับที่ตรงกับคำค้น</span>
        </p>
        <nav class="newsx-pages" aria-label="แบ่งหน้า" data-en-aria-label="Pagination" data-series-pages hidden></nav>
      </div>
    </section>

    <!-- The other series -->
    <section class="section section--alt" aria-labelledby="series-other-title">
      <div class="container">
        <div class="band-head">
          <div class="band-head__text">
            <p class="kicker" data-en="Publications">วารสารและสิ่งพิมพ์</p>
            <h2 id="series-other-title" class="section-title" data-en="Other series">ชุดสิ่งพิมพ์อื่น</h2>
          </div>
        </div>
        <ul class="pub-shelf pub-shelf--compact series-others" role="list" data-series-others></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
</body>
</html>
