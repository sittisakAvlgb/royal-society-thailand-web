<body>
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <!-- ==============================
       News → Photo Gallery → one album (news-album.html?id=…)
       Only the photographs: the album's title, kind, date and count, then
       every photo in a grid that opens the site's photo viewer; the news
       story stays one link away. Filled by 24-album.js from data/news.js
       and data/press.js.
  ================================ -->
  <main id="main-content" tabindex="-1" data-album>
    <!-- Opening: the green band with the album's own cover photograph -->
    <div class="hhero hhero--study">
      <div class="hhero__art" aria-hidden="true"><img src="../assets/images/news/news-lead.jpg" alt="" decoding="async" data-album-art></div>
      <div class="container hhero__inner">
        <nav class="breadcrumb hhero__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
          <ol>
            <li><a href="../index.html" data-en="Home">หน้าแรก</a></li>
            <li><a href="news.html" data-en="News">ข่าวสาร</a></li>
            <li><a href="news-gallery.html" data-en="Photo Gallery">คลังรูปภาพ</a></li>
            <li><span aria-current="page" data-album-crumb data-en="Album">อัลบั้มภาพ</span></li>
          </ol>
        </nav>
        <div class="hhero__text">
          <p class="hhero__title album-hero__title" data-en="Photo Gallery">คลังรูปภาพ</p>
        </div>
      </div>
    </div>

    <section class="section album" aria-labelledby="album-title">
      <div class="container">
        <header class="album__head">
          <h1 class="album__title" id="album-title" data-album-title></h1>
          <div class="album__meta">
            <ul class="album__facts" role="list" data-album-facts></ul>
            <div class="album__links">
              <a class="news-cta news-cta--back album__back" href="news-gallery.html"><span class="news-cta__dot" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg></span><span data-en="All albums">อัลบั้มทั้งหมด</span></a>
              <a class="news-cta album__story" href="news.html" data-album-story hidden><span data-en="Read the story">อ่านข่าว</span><span class="news-cta__dot" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg></span></a>
            </div>
          </div>
        </header>
        <ul class="album__grid" role="list" data-album-grid></ul>
        <p class="album__empty" data-album-empty hidden data-en="This album could not be found.">ไม่พบอัลบั้มนี้ <a href="news-gallery.html">กลับไปคลังรูปภาพ</a></p>
      </div>
    </section>

    <!-- Other albums, as the gallery's framed cards -->
    <section class="section section--alt album-more" aria-labelledby="album-more-title" data-album-more-box hidden>
      <div class="container">
        <h2 class="album-more__title" id="album-more-title" data-en="Other albums">อัลบั้มอื่น ๆ</h2>
        <ul class="newsx-items newsx-items--grid newsx-albumlist" role="list" data-album-more></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
</body>
</html>
