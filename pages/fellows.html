        <div class="story__crumbbar">

              <li><a href="../index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-institution"></use></svg><span data-en="Home">หน้าแรก</span></a></li>
              <li><span aria-current="page" data-en="Fellows and Associate Fellows">ราชบัณฑิตและภาคีสมาชิก</span></li>
            </ol>
          </nav>
        </div>
        <h1 class="story__title newsx-head__title" data-en="Fellows and Associate Fellows">ราชบัณฑิตและภาคีสมาชิก</h1>
        <p class="story__dek newsx-head__lead" data-en="The Fellows, Honorary Fellows and Associate Fellows of the three academies — find them by name, field or expertise.">ราชบัณฑิต ราชบัณฑิตกิตติมศักดิ์ และภาคีสมาชิกของทั้ง ๓ สำนัก ค้นหาได้จากชื่อ สาขาวิชา หรือความเชี่ยวชาญ</p>
        <dl class="series-facts fellowx-tally" data-fellowx-tally></dl>
      </div>
    </header>

    <!-- The directory (17-fellows.js): academy tabs on the left; search,
         membership and the grid / list switch on the right -->
    <section id="fellow-directory" aria-labelledby="directory-title" data-fellowx>
      <h2 class="visually-hidden" id="directory-title" data-en="Search Fellows">ค้นหาสมาชิก</h2>
      <div class="container newsx-toolbar">
        <div class="newsx-tools">
          <div class="news-tabs" role="group" aria-label="เลือกสำนัก" data-en-aria-label="Choose an academy">
            <button class="news-tab is-active" type="button" data-fellowx-academy="" aria-pressed="true" data-en="All academies">ทุกสำนัก</button>
            <button class="news-tab" type="button" data-fellowx-academy="moral" aria-pressed="false" data-en="Moral and Political Sciences">ธรรมศาสตร์และการเมือง</button>
            <button class="news-tab" type="button" data-fellowx-academy="science" aria-pressed="false" data-en="Science">วิทยาศาสตร์</button>
            <button class="news-tab" type="button" data-fellowx-academy="arts" aria-pressed="false" data-en="Arts">ศิลปกรรม</button>
          </div>
          <div class="newsx-tools__end">
            <label class="newsx-search">
              <span class="visually-hidden" data-en="Search by name, field or expertise">ค้นหาจากชื่อ สาขาวิชา หรือความเชี่ยวชาญ</span>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
              <input type="search" placeholder="ชื่อ สาขาวิชา ความเชี่ยวชาญ" data-en-placeholder="Name, field or expertise" autocomplete="off" enterkeyhint="search" data-fellowx-search>
            </label>
            <div class="rs-select fellowx-type" data-select>
              <span class="visually-hidden" id="fellowx-type-label" data-en="Membership">ประเภทสมาชิก</span>
              <input type="hidden" name="type" value="" data-fellowx-type>
              <button class="rs-select__btn" type="button" id="fellowx-type" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="fellowx-type-label fellowx-type">
                <svg class="icon rs-select__icon" aria-hidden="true" focusable="false"><use href="#i-people"></use></svg>
                <span class="rs-select__label" data-select-label data-en="All members">ทุกประเภท</span>
                <svg class="icon rs-select__chevron" aria-hidden="true" focusable="false"><use href="#i-chevron"></use></svg>
              </button>
              <ul class="rs-select__list" role="listbox" aria-labelledby="fellowx-type-label" hidden>
                <li class="rs-select__option" role="option" tabindex="-1" data-value="" aria-selected="true"><span data-en="All members">ทุกประเภท</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></li>
                <li class="rs-select__option" role="option" tabindex="-1" data-value="honorary" aria-selected="false"><span data-en="Honorary Fellows">ราชบัณฑิตกิตติมศักดิ์</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></li>
                <li class="rs-select__option" role="option" tabindex="-1" data-value="associate" aria-selected="false"><span data-en="Associate Fellows">ภาคีสมาชิก</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></li>
                <li class="rs-select__option" role="option" tabindex="-1" data-value="fellow" aria-selected="false"><span data-en="Fellows">ราชบัณฑิต</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg></li>
              </ul>
            </div>
            <div class="newsx-view" role="group" aria-label="รูปแบบการแสดงผล" data-en-aria-label="View">
              <button class="btn btn--secondary btn--sm newsx-view__btn is-active" type="button" data-fellowx-view="grid" aria-pressed="true" title="แบบตาราง" data-en-title="Grid view">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                <span data-en="Grid">ตาราง</span>
              </button>
              <button class="btn btn--secondary btn--sm newsx-view__btn" type="button" data-fellowx-view="list" aria-pressed="false" title="แบบรายการ" data-en-title="List view">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="15" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6h8M12 8.5h5M12 16h8M12 18.5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span data-en="List">รายการ</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="section newsx">
        <div class="container">
          <p class="newsx-count" aria-live="polite" data-fellowx-count></p>
          <div data-fellowx-items></div>
          <div class="newsx-empty" data-fellowx-empty hidden>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
            <span data-en="No one matches your search.">ไม่พบรายชื่อที่ตรงกับคำค้น</span>
            <button class="btn btn--secondary btn--sm" type="button" data-fellowx-clear data-en="Clear filters">ล้างตัวกรอง</button>
          </div>
          <nav class="newsx-pages" aria-label="แบ่งหน้า" data-en-aria-label="Pagination" data-fellowx-pages hidden></nav>
