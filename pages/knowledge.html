    <!-- ==============================

         in a sticky index on the left (with counts); choosing one narrows
         the articles on the right, framed cards in a grid or a list with a
         pager, so the catalogue takes any number from the CMS.
         Content: data/knowledge.js
    ================================ -->
    <div class="hhero hhero--study kn-hero">
      <div class="hhero__art" aria-hidden="true"><img src="../assets/images/news/press/6287eda558.jpg" alt="" decoding="async"></div>
      <div class="container hhero__inner">
        <nav class="breadcrumb hhero__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
          <ol>
            <li><a href="../index.html" data-en="Home">หน้าแรก</a></li>
            <li><span aria-current="page" data-en="Knowledge">องค์ความรู้</span></li>
          </ol>
        </nav>
        <div class="hhero__text">
          <h1 class="hhero__title" data-en="Knowledge">องค์ความรู้</h1>
          <p class="hhero__lead" data-en="Articles and knowledge from Fellows and experts, arranged by field. Choose a field or search for a topic.">บทความและความรู้จากราชบัณฑิตและผู้เชี่ยวชาญ จัดตามสาขาวิชา เลือกสาขาที่สนใจหรือค้นหาเรื่องที่ต้องการ</p>
          <form class="kn-search kn-hero__search" action="search.html" role="search" data-kn-search>
            <label class="visually-hidden" for="kn-q" data-en="Search knowledge">ค้นหาองค์ความรู้</label>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
            <input id="kn-q" name="q" type="search" autocomplete="off" placeholder="ค้นหาบทความ เช่น คำยืม ภูมิอากาศ" data-en-placeholder="Search articles, e.g. loanwords, climate">
            <button class="btn btn--primary" type="submit" data-en="Search">ค้นหา</button>
          </form>
        </div>
      </div>
    </div>

    <div class="container kn-body">
      <aside class="kn-index" aria-label="สาขาวิชา" data-en-aria-label="Fields">
        <p class="kn-index__label" data-en="Fields">สาขาวิชา</p>
        <ul class="kn-index__list" role="list" data-kn-fields></ul>
      </aside>

      <section class="kn-main" aria-labelledby="kn-title">
        <div class="kn-main__head">
          <div>
            <h2 id="kn-title" class="kn-main__title" data-kn-title>บทความทั้งหมด</h2>
            <p class="kn-main__desc" data-kn-desc></p>
          </div>
        </div>
        <!-- one bar: how many, then the grid / list switch (as on the news page) -->
        <div class="newsx-tools kn-tools">
          <p class="newsx-count" aria-live="polite" data-kn-count></p>
            <div class="newsx-view" role="group" aria-label="รูปแบบการแสดงผล" data-en-aria-label="View">
              <button class="btn btn--secondary btn--sm newsx-view__btn is-active" type="button" data-newsx-view="grid" aria-pressed="true" title="แบบตาราง" data-en-title="Grid view">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>

                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="15" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6h8M12 8.5h5M12 16h8M12 18.5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

        <nav class="newsx-pages" aria-label="แบ่งหน้า" data-en-aria-label="Pagination" data-kn-pages hidden></nav>
