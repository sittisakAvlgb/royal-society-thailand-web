<body class="page-news-story">
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <!-- One template for every story: 13-news-detail.js fills it from
       assets/js/data/news.js by ?id= (an unknown id shows the newest story) -->
  <main id="main-content" tabindex="-1" class="story" data-news-story>
    <article aria-labelledby="story-title">
      <!-- Magazine opening: the headline on the left, the photo on the right
           hanging over the edge of the cream band -->
      <header class="story__head">
        <div class="container">
          <!-- Breadcrumb: a quiet line above the headline and photo -->
          <div class="story__crumbbar">
            <nav class="breadcrumb story__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
              <ol>
                <li><a href="../index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-institution"></use></svg><span data-en="Home">หน้าแรก</span></a></li>
                <li><a href="news.html" data-en="News">ข่าวสาร</a></li>
                <li><span aria-current="page" data-story-crumb></span></li>
              </ol>
            </nav>
          </div>

          <div class="story__open">
            <div class="story__open-text">
              <p class="story__meta"><span class="story__cat" data-story-cat></span><time data-story-date></time></p>
              <h1 class="story__title" id="story-title" data-story-title></h1>
              <p class="story__dek" data-story-dek></p>
              <div class="story__bar">
                <p class="story__by"><span data-en="Issued by">เผยแพร่โดย</span> <strong data-story-by></strong></p>
                <div class="article-tools story__tools" role="group" aria-label="เครื่องมือ" data-en-aria-label="Tools">
                  <button class="btn btn--secondary btn--sm" type="button" data-share>
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-share"></use></svg><span data-en="Share">แชร์</span>
                  </button>
                  <button class="btn btn--secondary btn--sm" type="button" data-copy-link>
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-copy"></use></svg><span data-en="Copy link">คัดลอกลิงก์</span>
                  </button>
                  <button class="btn btn--secondary btn--sm" type="button" data-print>
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-print"></use></svg><span data-en="Print">พิมพ์</span>
                  </button>
                </div>
              </div>
            </div>
            <figure class="story__figure">
              <img data-story-img src="../assets/images/news/news-lead.jpg" alt="" width="1200" height="800" decoding="async">
              <figcaption data-story-caption></figcaption>
            </figure>
          </div>
        </div>
      </header>

      <div class="container">
        <div class="story__grid story__grid--plain">
          <div class="story__main">
            <p class="note-box" data-en-notice hidden>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg>
              <span>This story is available in Thai only.</span>
            </p>
            <div class="prose story__body" data-th-only data-story-body></div>
          </div>
        </div>

        <!-- Under the story: its attachments first, then its photographs (open full size) -->
        <div class="story__extras story__extras--docs-first" data-story-extras hidden>
          <section class="story__docs" aria-labelledby="story-files-title" data-story-files hidden>
            <h2 class="story__extras-title" id="story-files-title"><span data-en="Attachments">เอกสารแนบ</span> <span class="story__files-count" data-story-files-count></span></h2>
            <ul class="story__docs-list" role="list" data-story-files-list></ul>
          </section>
          <section class="story__album" aria-labelledby="story-album-title" data-story-album hidden>
            <h2 class="story__extras-title" id="story-album-title"><span data-en="Photos">ภาพประกอบข่าว</span> <span class="story__files-count" data-story-album-count></span></h2>
            <ul class="story__album-grid" role="list" data-story-album-list></ul>
          </section>
        </div>
      </div>
    </article>

    <!-- Other stories in the home news band's card -->
    <section class="section section--alt story__more-band" aria-labelledby="story-more-title">
      <div class="container">
        <div class="band-head">
          <div class="band-head__text">
            <p class="kicker" data-en="News &amp; events">ข่าวสารและกิจกรรม</p>
            <h2 id="story-more-title" class="section-title" data-en="More news">ข่าวอื่น ๆ</h2>
          </div>
          <a class="btn btn--primary btn--pill" href="news.html">
            <span data-en="View all">ดูทั้งหมด</span>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg>
          </a>
        </div>
        <ul class="news-cards story__cards" role="list" data-story-more></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
</body>
</html>
