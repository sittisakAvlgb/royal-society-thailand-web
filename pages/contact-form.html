        <h1 data-en="Online Contact Form">แบบฟอร์มติดต่อออนไลน์</h1>
        <p class="page-header__lead" data-en="Send a question or comment to the Office of the Royal Society; the Office replies by email.">ส่งคำถามหรือข้อเสนอแนะถึงสำนักงานราชบัณฑิตยสภา สำนักงานจะตอบกลับทางอีเมล</p>
      </div>

    <div class="container content-layout">
      <!-- ==============================
           8.2 Online Contact Form
           Prototype only: the form is not wired to a backend.
      ================================ -->
      <section class="topic-section" id="contact-form" aria-labelledby="contact-form-title">
        <h2 id="contact-form-title" class="visually-hidden" data-en="Online Contact Form">แบบฟอร์มติดต่อออนไลน์</h2>
        <p data-en="Send a question or comment to the Office. Fields marked * are required.">ส่งคำถามหรือข้อเสนอแนะถึงสำนักงาน ช่องที่มีเครื่องหมาย * จำเป็นต้องกรอก</p>
        <!-- TODO (Backend): connect to the enquiry system and add spam protection -->
        <form class="stack" action="contact-form.html" method="get" aria-labelledby="contact-form-title">
          <div class="field">
            <label class="field__label" for="cf-name"><span data-en="Full name">ชื่อ-นามสกุล</span> *</label>
            <input class="input" id="cf-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label class="field__label" for="cf-email"><span data-en="Email">อีเมล</span> *</label>
            <input class="input" id="cf-email" name="email" type="email" autocomplete="email" required>
            <p class="field__hint" data-en="We will reply to this address.">สำนักงานจะตอบกลับทางอีเมลนี้</p>
          </div>
          <div class="field">
            <label class="field__label" for="cf-topic"><span data-en="Topic">เรื่องที่ติดต่อ</span> *</label>
            <select class="select" id="cf-topic" name="topic" required>
              <option value="" data-en="Choose a topic">เลือกเรื่องที่ติดต่อ</option>
              <option value="language" data-en="Words, terms and the Thai language">สอบถามศัพท์และภาษา</option>
              <option value="academic" data-en="Academic enquiry">สอบถามข้อมูลทางวิชาการ</option>
              <option value="publications" data-en="Journals and Publications">วารสารและสิ่งพิมพ์</option>
              <option value="website" data-en="Website problem">ปัญหาการใช้งานเว็บไซต์</option>
              <option value="other" data-en="Other">อื่น ๆ</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="cf-message"><span data-en="Message">ข้อความ</span> *</label>
            <textarea class="textarea" id="cf-message" name="message" rows="6" required></textarea>
          </div>
          <div>
            <button class="btn btn--primary" type="submit">
              <span data-en="Send message">ส่งข้อความ</span>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg>
            </button>
          </div>
        </form>
      </section>
