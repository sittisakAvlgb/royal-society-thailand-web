  <script defer src="../assets/js/data/splash.js?v=20261129i"></script>

  <script defer src="../assets/js/10-consent.js?v=20261129i"></script>
</head>
<body>
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <!-- One template for every publication: 15-publication.js fills it from
       assets/js/data/publications.js by ?id= (an unknown id shows the newest) -->
  <main id="main-content" tabindex="-1" class="story pub" data-publication>
    <article aria-labelledby="pub-title">
      <!-- Opening on the cream band: the cover on the left, the record beside it -->
      <header class="story__head pub-head">
        <div class="container">
          <div class="story__crumbbar">
            <nav class="breadcrumb story__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
              <ol>
                <li><a href="../index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-institution"></use></svg><span data-en="Home">หน้าแรก</span></a></li>
                <li><span data-en="Publications">วารสารและสิ่งพิมพ์</span></li>
                <li data-pub-crumb-series hidden></li>
                <li><span aria-current="page" data-pub-crumb></span></li>
              </ol>
            </nav>
          </div>

          <div class="pub-open">
            <div class="pub-cover-wrap" data-pub-cover></div>

            <div class="pub-record">
              <p class="story__meta"><span class="story__cat" data-pub-kind></span><time data-pub-date></time></p>
              <h1 class="story__title pub-record__title" id="pub-title" data-pub-title></h1>
              <p class="pub-record__issue" data-pub-issue></p>

              <dl class="pub-facts" data-pub-facts></dl>

              <div class="pub-actions">
                <a class="btn btn--primary" href="#" download data-pub-download>
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"></use></svg>
                  <span data-pub-download-label></span>
                </a>
                <a class="btn btn--secondary pub-actions__btn" href="#pub-cite">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-doc"></use></svg><span data-en="Cite">อ้างอิง</span>
                </a>
                <button class="btn btn--secondary pub-actions__btn" type="button" data-share>
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-share"></use></svg><span data-en="Share">แชร์</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="container">
        <div class="pub-body">
          <section class="pub-section" aria-labelledby="pub-about-title">
            <h2 class="pub-section__title" id="pub-about-title" data-en="About this publication">เกี่ยวกับสิ่งพิมพ์นี้</h2>
            <p class="note-box" data-en-notice hidden>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg>
              <span>This publication is in Thai.</span>
            </p>
            <div class="prose story__body" data-th-only data-pub-summary></div>
          </section>

          <!-- Contents, set like a printed contents page (hidden when there are none) -->
          <section class="pub-section" aria-labelledby="pub-contents-title" data-pub-contents hidden>
            <h2 class="pub-section__title" id="pub-contents-title" data-en="Contents">สารบัญ</h2>
            <ol class="pub-toc" role="list" data-pub-toc></ol>
          </section>

          <!-- Citation: static tabs (04-interactions.js binds them), text filled by 15-publication.js -->
          <section class="pub-section citation" id="pub-cite" data-citation aria-labelledby="pub-cite-title">
            <h2 class="pub-section__title" id="pub-cite-title" data-en="Cite this publication">อ้างอิงสิ่งพิมพ์นี้</h2>
            <div class="tabs" data-tabs>
              <div class="tabs__list" role="tablist" aria-label="รูปแบบการอ้างอิง" data-en-aria-label="Citation format">
                <button class="tabs__tab" role="tab" id="pub-cite-tab-apa" aria-controls="pub-cite-apa" aria-selected="true" type="button">APA</button>
                <button class="tabs__tab" role="tab" id="pub-cite-tab-chicago" aria-controls="pub-cite-chicago" aria-selected="false" type="button">Chicago</button>
              </div>
              <div class="tabs__panel" role="tabpanel" id="pub-cite-apa" aria-labelledby="pub-cite-tab-apa" tabindex="0">
                <p class="citation__text" lang="th" data-pub-cite="apa"></p>
              </div>
              <div class="tabs__panel" role="tabpanel" id="pub-cite-chicago" aria-labelledby="pub-cite-tab-chicago" tabindex="0" hidden>
                <p class="citation__text" lang="th" data-pub-cite="chicago"></p>
              </div>
            </div>
            <div class="citation__actions">
              <button class="btn btn--secondary btn--sm" type="button" data-copy-citation>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-copy"></use></svg>
                <span data-en="Copy citation">คัดลอกการอ้างอิง</span>
              </button>
            </div>
          </section>
        </div>
      </div>
    </article>

    <!-- Other publications as a shelf of covers -->
    <section class="section section--alt" aria-labelledby="pub-more-title">
      <div class="container">
        <div class="band-head">
          <div class="band-head__text">
            <p class="kicker" data-en="Publications">วารสารและสิ่งพิมพ์</p>
            <h2 id="pub-more-title" class="section-title" data-en="More publications">สิ่งพิมพ์อื่น ๆ</h2>
          </div>
        </div>
        <ul class="pub-shelf pub-shelf--compact" role="list" data-pub-more></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
</body>
</html>
