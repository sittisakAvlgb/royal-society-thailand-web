          <div class="newsx-tools__end">
          <a class="btn btn--secondary btn--sm gallery-tools__yt" href="https://www.youtube.com/channel/UCFGKmCXh_pWaawbilPgZ69g" target="_blank" rel="noopener"><span data-en="YouTube channel">ช่อง YouTube</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-external"></use></svg><span class="visually-hidden" data-en="(opens in a new tab)">(เปิดในแท็บใหม่)</span></a>

  <script>
    /* the videos as the news page's framed cards, in a grid or a list (the
       reader's choice, shared with the news page); a still with a play
       button, the YouTube player loading only when asked */
    document.addEventListener('DOMContentLoaded', () => window.RS && RS.ready(() => {
      const box = document.querySelector('[data-gallery-videos]');
      const list = document.querySelector('[data-gallery-videos-list]');
      /* newest first, so a video added to data/videos.js lands on page one */
      const items = [...(window.RS_VIDEOS || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      if (!box || !list || !items.length) return;
      const esc = RS.escapeHTML;
      const TH = RS.lang === 'th';
      const play = TH ? 'เล่นวิดีโอ' : 'Play the video';
      const read = TH ? 'อ่านต่อ' : 'Read more';
      const VIEW_KEY = 'rs-news-view';
      const SIZE_KEY = 'rs-videos-size';
      /* videos per page: whole rows of the four-across grid */
      const SIZES = [12, 24, 48];
      let size = SIZES[0];
      let page = 1;
      try { const saved = Number(localStorage.getItem(SIZE_KEY)); if (SIZES.includes(saved)) size = saved; } catch { /* storage unavailable */ }
      const nav = box.querySelector('[data-gallery-videos-pages]');
      let view = 'grid';
      try { if (localStorage.getItem(VIEW_KEY) === 'list') view = 'list'; } catch { /* storage unavailable */ }
      const count = box.querySelector('[data-gallery-videos-count]');
      if (count) count.textContent = RS.digits(TH ? `${items.length} วิดีโอ` : `${items.length} videos`);

      function render() {
        list.className = `newsx-items newsx-items--${view}`;
        const pages = Math.max(1, Math.ceil(items.length / size));
        page = Math.min(page, pages);
        if (nav) {
          nav.hidden = false;
          nav.classList.add('pager');
          nav.classList.toggle('pager--single', pages < 2);
          nav.innerHTML = RS.pagerHTML({ page, pages, total: items.length, size, sizes: SIZES, unit: { th: 'วิดีโอ', en: items.length === 1 ? 'video' : 'videos' } });
        }
        list.innerHTML = items.slice((page - 1) * size, page * size).map((v, i) => {
          const report = esc(RS.url('pages/activity.html?id=' + encodeURIComponent(v.report)));
          return `
          <li class="newsx-item" style="animation-delay:${Math.min(i, 11) * 30}ms">
            <article class="newsx-card gallery-vcard">
              <div class="newsx-card__media">
                <button type="button" class="act-video__play" data-video="${esc(v.id)}" aria-label="${play}: ${esc(v.title)}">
                  <img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" width="480" height="360" loading="lazy" decoding="async">
                  <span class="act-video__btn" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg></span>
                </button>
              </div>
              <div class="newsx-card__body">
                <span class="news-cat">${esc(v.cat)}</span>
                <a class="newsx-card__title" href="${report}">${esc(v.title)}</a>
                <span class="news-card__foot newsx-card__foot">
                  <time datetime="${esc(v.date)}">${RS.formatDate(v.date, { day: 'numeric', month: 'short', year: 'numeric' })}</time>
                  <a class="news-cta gallery-vcard__report" href="${report}"><span>${read}</span><span class="news-cta__dot" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg></span></a>
                </span>
              </div>
            </article>
          </li>`;
        }).join('');
        document.dispatchEvent(new CustomEvent('rs:content-added', { detail: box }));
      }

      const syncButtons = () => box.querySelectorAll('[data-newsx-view]').forEach(btn => {
        const on = btn.dataset.newsxView === view;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-pressed', String(on));
      });
      box.querySelector('.newsx-view')?.addEventListener('click', event => {
        const btn = event.target.closest('[data-newsx-view]');
        if (!btn) return;
        view = btn.dataset.newsxView === 'list' ? 'list' : 'grid';
        try { localStorage.setItem(VIEW_KEY, view); } catch { /* storage unavailable */ }
        syncButtons();
        render();
      });
      list.addEventListener('click', event => {
        const b = event.target.closest('[data-video]');
        if (!b) return;
        b.parentElement.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.video)}?autoplay=1&rel=0" title="${play}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      });
      nav?.addEventListener('click', event => {
        const sizeBtn = event.target.closest('[data-pager-size]');
        if (sizeBtn) {
          size = Number(sizeBtn.dataset.pagerSize);
          try { localStorage.setItem(SIZE_KEY, String(size)); } catch { /* storage unavailable */ }
          page = 1;
          render();
          nav.querySelector('.pager__menu-btn')?.focus();
          return;
        }
        const btn = event.target.closest('[data-pager-page]');
        if (!btn || btn.disabled) return;
        page = Number(btn.dataset.pagerPage);
        render();
        box.querySelector('.gallery-tools')?.scrollIntoView({ block: 'start', behavior: RS.reduceMotion() ? 'auto' : 'smooth' });
      });
      syncButtons();
      render();
      box.hidden = false;
    }));
  </script>
