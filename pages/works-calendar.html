        <section class="about-part works-calendar events-band" aria-labelledby="planner-title">
          <h2 class="visually-hidden" id="planner-title" data-en="Events calendar">ปฏิทินกิจกรรม</h2>
          <div class="tearoff tearoff--side" data-tearoff="20">
