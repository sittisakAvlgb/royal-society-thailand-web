<body>
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <main id="main-content" tabindex="-1" data-news-list data-news-cats="news,announcement,activity">
    <!-- Opening: the green band with a photograph, as on the other news pages -->
    <div class="hhero hhero--study">
      <div class="hhero__art" aria-hidden="true"><img src="../assets/images/news/news-02.jpg" alt="" decoding="async"></div>
      <div class="container hhero__inner">
        <nav class="breadcrumb hhero__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
          <ol>
            <li><a href="../index.html" data-en="Home">หน้าแรก</a></li>
            <li><a href="news.html" data-en="News">ข่าวสาร</a></li>
            <li><span aria-current="page" data-en="News and Announcements">ข่าวประชาสัมพันธ์</span></li>
          </ol>
        </nav>
        <div class="hhero__text">
          <h1 class="hhero__title" data-en="News and Announcements">ข่าวประชาสัมพันธ์</h1>
          <p class="hhero__lead" data-en="News, announcements and activities of the Royal Society of Thailand.">ข่าว ประกาศ และกิจกรรมของราชบัณฑิตยสภา</p>
        </div>
      </div>
    </div>

    <!-- One control bar: category tabs on the left; search and the grid / list switch on the right -->
    <div class="container newsx-toolbar">
      <div class="newsx-tools">
        <div class="news-tabs" role="group" aria-label="กรองข่าวตามหมวดหมู่" data-en-aria-label="Filter news by category" data-newsx-tabs>
          <button class="news-tab is-active" type="button" data-filter="all" aria-pressed="true" data-en="All">ทั้งหมด</button>
          <button class="news-tab" type="button" data-filter="news" aria-pressed="false" data-en="News">ข่าว</button>
          <button class="news-tab" type="button" data-filter="announcement" aria-pressed="false" data-en="Announcements">ประกาศ</button>
          <button class="news-tab" type="button" data-filter="activity" aria-pressed="false" data-en="Activities">กิจกรรม</button>
        </div>
        <div class="newsx-tools__end">
        <label class="newsx-search">
          <span class="visually-hidden" data-en="Search news">ค้นหาข่าว</span>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
          <input type="search" placeholder="ค้นหาข่าว" data-en-placeholder="Search news" autocomplete="off" data-newsx-search>
        </label>
        <div class="newsx-view" role="group" aria-label="รูปแบบการแสดงผล" data-en-aria-label="View">
          <button class="btn btn--secondary btn--sm newsx-view__btn is-active" type="button" data-newsx-view="grid" aria-pressed="true" title="แบบตาราง" data-en-title="Grid view">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span data-en="Grid">ตาราง</span>
          </button>
          <button class="btn btn--secondary btn--sm newsx-view__btn" type="button" data-newsx-view="list" aria-pressed="false" title="แบบรายการ" data-en-title="List view">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="15" width="5" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6h8M12 8.5h5M12 16h8M12 18.5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span data-en="List">รายการ</span>
          </button>
        </div>
        </div>
      </div>
    </div>

    <!-- The stories, newest first, all at one size: a grid of cards or a list of rows -->
    <section class="section newsx" id="news" aria-labelledby="newsx-title">
      <div class="container">
        <h2 class="visually-hidden" id="newsx-title" data-en="All news">ข่าวทั้งหมด</h2>
        <!-- Count on the left, the grid / list switch on the right -->
        <p class="newsx-count" aria-live="polite" data-newsx-count></p>
        <ul class="newsx-items newsx-items--grid" role="list" data-newsx-items></ul>
        <p class="newsx-empty" data-newsx-empty hidden>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
          <span data-en="No news matches your search.">ไม่พบข่าวที่ตรงกับคำค้น</span>
        </p>
        <nav class="newsx-pages" aria-label="แบ่งหน้า" data-en-aria-label="Pagination" data-newsx-pages></nav>
      </div>
    </section>

  </main>

  <div id="app-footer"></div>
</body>
