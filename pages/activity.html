<body class="page-news-story">
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <!-- One template for every story: 13-news-detail.js fills it from
       assets/js/data/news.js by ?id= (an unknown id shows the newest story) -->
  <!-- One template for every activity report: 20-activity.js fills it
       from assets/js/data/activities.js by ?id= -->
  <!-- ==============================
       One activity report, filled by 20-activity.js from data/activities.js
       (title, date, academy, cover) and data/activity-bodies.js (the text,
       photographs, videos and PDFs brought across from the earlier sites).
       A green band with the topic; the cover photograph over its edge; the
       facts in one line; the report; photographs, video and documents;
       more from the series.
  ================================ -->
  <main id="main-content" tabindex="-1" class="act" data-activity>
    <article aria-labelledby="story-title" data-activity-article>
      <header class="act-head">
        <div class="container">
          <nav class="breadcrumb hhero__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
            <ol>
              <li><a href="../index.html" data-en="Home">หน้าแรก</a></li>
              <li><span data-en="Academic Activities">กิจกรรมวิชาการ</span></li>
              <li><a href="works-on-tour.html" data-activity-series></a></li>
              <li><span aria-current="page" data-activity-crumb></span></li>
            </ol>
          </nav>
          <div class="act-head__grid">
          <div class="act-head__text">
            <p class="act-head__meta"><span data-activity-cat></span><span class="act-head__dot" aria-hidden="true"></span><time data-activity-date></time></p>
            <p class="act-head__kicker" data-activity-kicker hidden></p>
            <h1 class="act-head__title" id="story-title" data-activity-title></h1>
            <div class="act-facts">
              <dl class="act-facts__list" data-activity-facts></dl>
              <div class="act-facts__tools" role="group" aria-label="เครื่องมือ" data-en-aria-label="Tools">
                <button class="act-tool" type="button" data-share><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-share"></use></svg><span data-en="Share">แชร์</span></button>
                <button class="act-tool" type="button" data-copy-link><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-copy"></use></svg><span data-en="Copy link">คัดลอกลิงก์</span></button>
                <button class="act-tool" type="button" data-print><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-print"></use></svg><span data-en="Print">พิมพ์</span></button>
              </div>
            </div>
          </div>
          <figure class="act-cover">
            <img data-activity-img alt="" width="1200" height="800" decoding="async" fetchpriority="high">
          </figure>
          </div>
        </div>
      </header>

      <!-- The report beside its overview: what it was, when, where, who
           (Fellows linked to their pages), what this page holds, and the
           academy that held it. The overview comes from the record's
           `overview` fields (CMS) or, until they are filled, is read from the
           report's own text (20-activity.js). -->
      <div class="container act-layout">
        <aside class="act-aside" aria-labelledby="act-overview-title" data-activity-aside>
          <h2 class="act-aside__title" id="act-overview-title" data-en="At a glance">ภาพรวม</h2>
          <dl class="act-over" data-activity-overview></dl>
          <div class="act-people" data-activity-people hidden>
            <h3 class="act-aside__sub" data-activity-people-title></h3>
            <ul class="act-people__list" role="list" data-activity-people-list></ul>
          </div>
          <div class="act-acad" data-activity-academy hidden></div>
        </aside>
        <div class="act-main">

        <p class="note-box act-en" data-en-notice hidden>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg>
          <span>This report is available in Thai only.</span>
        </p>
        <div class="act-body" data-th-only data-activity-body></div>

        <section class="act-sec" aria-labelledby="act-photos-title" data-activity-photos hidden>
          <div class="act-sec__head">
            <h2 class="act-sec__title" id="act-photos-title" data-en="Photographs">ภาพบรรยากาศ</h2>
            <span class="act-sec__count" data-activity-photos-count></span>
          </div>
          <ul class="act-photos" role="list" data-activity-photos-list></ul>
        </section>

        <section class="act-sec" aria-labelledby="act-videos-title" data-activity-videos hidden>
          <div class="act-sec__head"><h2 class="act-sec__title" id="act-videos-title" data-en="Video">ชมวิดีโอ</h2></div>
          <div class="act-videos" data-activity-videos-list></div>
        </section>

        <section class="act-sec" aria-labelledby="act-files-title" data-activity-files hidden>
          <div class="act-sec__head"><h2 class="act-sec__title" id="act-files-title" data-en="Documents">เอกสารประกอบ</h2></div>
          <ul class="act-files" role="list" data-activity-files-list></ul>
        </section>
        </div>
      </div>
    </article>

    <!-- More reports from the same series -->
    <section class="section section--alt" aria-labelledby="activity-more-title">
      <div class="container">
        <div class="works-series__head fellowp-more__head">
          <div class="band-head__text">
            <p class="kicker" data-en="Academic Activities">กิจกรรมวิชาการ</p>
            <h2 id="activity-more-title" class="section-title" data-activity-more-title></h2>
          </div>
          <a class="btn btn--primary btn--pill" href="works-on-tour.html" data-activity-all><span data-en="View all">ดูทั้งหมด</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg></a>
        </div>
        <ul class="newsx-items newsx-items--grid works-list__items" role="list" data-activity-more></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
</body>
