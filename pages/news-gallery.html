<body>
  <div id="app-header"></div>
  <!-- Shown while the page sets itself up (header, Thai font); 02-components.js
       lifts it, and CSS lifts it on its own after a few seconds regardless -->
  <div class="page-skel" aria-hidden="true">
    <div class="page-skel__bar"><span class="sk sk--logo"></span><span class="sk sk--nav"></span><span class="sk sk--btn"></span></div>
    <div class="page-skel__body">
      <span class="sk sk--crumb"></span>
      <div class="page-skel__hero">
        <div class="page-skel__text"><span class="sk sk--kicker"></span><span class="sk sk--title"></span><span class="sk sk--line"></span><span class="sk sk--line sk--short"></span></div>
        <span class="sk sk--art"></span>
      </div>
      <div class="page-skel__cards"><span class="sk sk--card"></span><span class="sk sk--card"></span><span class="sk sk--card"></span></div>
    </div>
  </div>

  <main id="main-content" tabindex="-1" data-news-list>
    <!-- Opening: the cream band of the story pages with the inner-page leaf
         artwork — breadcrumb, title and lead; the filter bar overlaps its edge -->
    <header class="story__head newsx-head">
      <div class="container">
        <div class="story__crumbbar">
          <nav class="breadcrumb story__crumb" aria-label="เส้นทางนำทาง" data-en-aria-label="Breadcrumb">
            <ol>
              <li><a href="../index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-institution"></use></svg><span data-en="Home">หน้าแรก</span></a></li>
              <li><a href="news.html" data-en="News">ข่าวสาร</a></li>
              <li><span aria-current="page" data-en="Photo and Video Gallery">คลังภาพและวิดีโอ</span></li>
            </ol>
          </nav>
        </div>
        <h1 class="story__title newsx-head__title" data-en="Photo and Video Gallery">คลังภาพและวิดีโอ</h1>
        <p class="story__dek newsx-head__lead" data-en="Photos from Royal Society events, one album per story — choose one to see every photo.">ภาพกิจกรรมของราชบัณฑิตยสภา จัดเป็นอัลบั้มตามข่าว เลือกอัลบั้มเพื่อดูภาพทั้งหมด</p>

      </div>
    </header>

    <!-- One album per story: its cover, how many photos, and the story
         (where the photos open in the viewer); the videos follow. -->
    <section class="section newsx newsx-albums" aria-labelledby="albums-title">
      <div class="container">
        <h2 class="visually-hidden" id="albums-title" data-en="Photo albums">อัลบั้มภาพ</h2>
        <p class="newsx-count" aria-live="polite" data-newsx-gallery-count></p>
        <ul class="newsx-gallery newsx-gallery--albums" role="list" data-newsx-gallery="albums"></ul>
        <nav class="newsx-pages" aria-label="แบ่งหน้า" data-en-aria-label="Pagination" data-newsx-gallery-pages hidden></nav>
      </div>
    </section>

    <!-- Videos (sitemap 3.14): the recordings from the activity reports
         (data/videos.js); a still with a play button, the player loading
         only when asked; the report it belongs to beneath -->
    <section class="section section--alt gallery-videos" id="videos" aria-labelledby="videos-title" data-gallery-videos hidden>
      <div class="container">
        <div class="band-head">
          <div class="band-head__text">
            <p class="kicker" data-en="Videos">วิดีโอ</p>
            <h2 id="videos-title" class="section-title" data-en="Lectures and events on video">วิดีโอการบรรยายและกิจกรรม</h2>
          </div>
          <a class="btn btn--primary btn--pill" href="https://www.youtube.com/channel/UCFGKmCXh_pWaawbilPgZ69g" target="_blank" rel="noopener"><span data-en="YouTube channel">ช่อง YouTube</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-external"></use></svg><span class="visually-hidden" data-en="(opens in a new tab)">(เปิดในแท็บใหม่)</span></a>
        </div>
        <ul class="gallery-videos__list" role="list" data-gallery-videos-list></ul>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <script>
    /* gallery videos: a still with a play button; the YouTube player loads only when asked */
    document.addEventListener('DOMContentLoaded', () => window.RS && RS.ready(() => {
      const box = document.querySelector('[data-gallery-videos]');
      const list = document.querySelector('[data-gallery-videos-list]');
      const items = window.RS_VIDEOS || [];
      if (!box || !list || !items.length) return;
      const esc = RS.escapeHTML;
      const play = RS.lang === 'th' ? 'เล่นวิดีโอ' : 'Play the video';
      const read = RS.lang === 'th' ? 'อ่านรายงาน' : 'Read the report';
      list.innerHTML = items.map(v => `
        <li class="gallery-video reveal">
          <div class="act-video">
            <button type="button" class="act-video__play" data-video="${esc(v.id)}" aria-label="${play}: ${esc(v.title)}">
              <img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" width="480" height="360" loading="lazy" decoding="async">
              <span class="act-video__btn" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg></span>
            </button>
          </div>
          <p class="gallery-video__meta"><span>${esc(v.cat)}</span> · <time datetime="${esc(v.date)}">${RS.formatDate(v.date, { day: 'numeric', month: 'short', year: 'numeric' })}</time></p>
          <a class="gallery-video__title" href="${esc(RS.url('pages/activity.html?id=' + encodeURIComponent(v.report)))}">${esc(v.title)}</a>
          <span class="visually-hidden">${read}</span>
        </li>`).join('');
      box.hidden = false;
      list.addEventListener('click', event => {
        const b = event.target.closest('[data-video]');
        if (!b) return;
        b.parentElement.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.video)}?autoplay=1&rel=0" title="${play}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      });
      document.dispatchEvent(new CustomEvent('rs:content-added', { detail: box }));
    }));
  </script>
